<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comics Block Maker</title>
<style>
:root{
  --bg:#e9e9e7;
  --card:#ffffff;
  --sub:#f5f5f3;
  --tx:#111111;
  --mut:#525252;
  --line:#111111;
  --subline:#9e9e9e;
  --acc:#111111;
  --acctx:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141414;
    --card:#1f1f1f;
    --sub:#292929;
    --tx:#f2f2f2;
    --mut:#a8a8a8;
    --line:#d4d4d4;
    --subline:#636363;
    --acc:#f2f2f2;
    --acctx:#111111;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:800;letter-spacing:.02em;margin:0 0 10px;padding:2px 8px;background:var(--acc);color:var(--acctx);display:inline-block}

/* 코믹스 직사각형 컷 프레임 */
section,.det{background:var(--card);border:1.5px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:14px;margin-bottom:14px}

button,select,input,textarea{font:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--line);padding:5px 9px}
button{cursor:pointer;font-weight:600;transition:background .1s,color .1s}
button:hover{background:var(--sub)}
button.on{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
button.on:hover{opacity:.88}
input[type=text],textarea,select{width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--line);outline-offset:-2px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;height:76px;resize:vertical}
.hint{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* 상단 캐릭터 설정 레이아웃 */
.top-grid{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start}
.c-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--subline)}
.chip{padding:4px 11px;font-weight:700;font-size:13px;border:1.5px solid transparent}
.chip.sel{outline:2px solid var(--line);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.cf{display:flex;gap:4px}.cf input{min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;padding:4px 6px}
.sw{flex:0 0 30px;height:29px;border:1px solid var(--line);cursor:pointer}
.sw.sel{outline:2px solid var(--line);outline-offset:1px}
.sv,.hue{position:relative;touch-action:none;cursor:crosshair;border:1.5px solid var(--line)}
.sv{height:112px}.hue{height:15px;margin-top:6px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sv i,.hue i{position:absolute;width:11px;height:11px;border:2px solid #fff;box-shadow:0 0 0 1.5px #000;transform:translate(-50%,-50%);pointer-events:none}
.hue i{top:50%}

/* 좌측 편집 / 우측 스티키 미리보기 2단 워크스페이스 */
.work{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.pv-box{position:sticky;top:14px}
.blk{border:1px solid var(--line);padding:8px;margin-bottom:8px;background:var(--sub)}
.bt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.bt select{width:auto;padding:3px 6px}
.bt button{padding:3px 8px}.bt input[type=number]{width:62px;padding:3px 6px}
.drop{border:1.5px dashed var(--subline);background:var(--sub);padding:12px 8px;text-align:center;color:var(--mut);cursor:pointer;margin-bottom:6px;font-size:13px;font-weight:600}
.drop:hover,.drop.over{border-color:var(--line);color:var(--tx)}
#pv{padding:12px;background:#fff;color:#222;border:1px solid var(--line)}
#pv.dk{background:#1c1c1c;color:#ddd}

/* 접이식 코드 영역 */
.det summary{cursor:pointer;font-weight:800;font-size:14px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
.det summary::-webkit-details-marker{display:none}
.det summary:before{content:"▶";font-size:10px;transition:transform .15s}
.det[open] summary:before{transform:rotate(90deg)}
.det[open] summary{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--subline)}

@media(max-width:900px){.top-grid,.work{grid-template-columns:1fr}.pv-box{position:static}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Comics Block Maker</h1>
  <div class="bar">
    <button type="button" id="exp">설정 내보내기 (.json)</button>
    <button type="button" id="impBtn">설정 불러오기 (.json)</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <span class="hint" id="msg2"></span>
  </div>
</header>

<!-- 1. 상단 캐릭터 설정 -->
<section>
  <div class="bar" style="justify-content:space-between;margin-bottom:8px">
    <h2 style="margin:0">1. 캐릭터 설정</h2>
    <div class="bar">
      <input type="text" id="newName" placeholder="새 이름 / 바꿀 이름" style="width:150px">
      <button type="button" id="add">추가</button>
      <button type="button" id="ren">이름 변경</button>
      <button type="button" id="del">삭제</button>
    </div>
  </div>
  <!-- 캐릭터 이름배경+이름색 칩 목록 -->
  <div class="c-chips" id="chips"></div>
  <div class="top-grid">
    <div>
      <div class="grid">
        <label class="f">나레이션 외곽선<span class="cf"><span class="sw" id="outS"></span><input type="text" id="outH" maxlength="7"></span></label>
        <label class="f">나레이션 채우기<span class="cf"><span class="sw" id="fillS"></span><input type="text" id="fillH" maxlength="7"></span></label>
        <label class="f">나레이션 글자색<span class="cf"><span class="sw" id="fontS"></span><input type="text" id="fontH" maxlength="7"></span></label>
        <label class="f">이름표 배경색<span class="cf"><span class="sw" id="nbgS"></span><input type="text" id="nbgH" maxlength="7"></span></label>
        <label class="f">이름표 글자색<span class="cf"><span class="sw" id="nfgS"></span><input type="text" id="nfgH" maxlength="7"></span></label>
        <label class="f">외곽선 종류<select id="bs"><option value="solid">실선</option><option value="dashed">파선</option><option value="dotted">점선</option></select></label>
      </div>
      <div class="bar" style="margin-top:8px"><span class="hint" id="tgt"></span><span class="hint" id="cmsg" style="font-weight:700;color:var(--tx)"></span></div>
    </div>
    <div>
      <div class="sv" id="sv"><i id="svc"></i></div>
      <div class="hue" id="hue"><i id="huec"></i></div>
    </div>
  </div>
</section>

<!-- 2. 좌측 대사 편집 / 우측 미리보기 -->
<div class="work">
  <section>
    <div class="bar" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">2. 블록 &amp; 이미지 편집</h2>
      <div class="bar">
        <button type="button" id="l1">1단</button>
        <button type="button" id="l2" class="on">2단</button>
      </div>
    </div>
    <div class="grid" style="margin-bottom:8px">
      <label class="f">나레이션 크기(px)<input type="number" id="fn" min="8" max="40" step="1"></label>
      <label class="f">대사 크기(px)<input type="number" id="fd" min="8" max="40" step="1"></label>
      <label class="f">외곽선 두께(px)<input type="number" id="bw" min="0.3" max="4" step="0.1"></label>
      <label class="f">모서리 둥글기(px)<input type="number" id="rad" min="0" max="30" step="1"></label>
    </div>
    <div class="drop" id="drop" tabindex="0">클릭 · 드래그 · Ctrl(⌘)+V 이미지 넣기<input type="file" id="file" accept="image/*" hidden></div>
    <div class="bar" style="margin-bottom:8px">
      <input type="text" id="imgurl" placeholder="또는 이미지 URL 주소 입력 (https://...)" style="flex:1;min-width:140px">
      <button type="button" id="imgclr">이미지 비우기</button>
      <span class="hint" id="imsg"></span>
    </div>
    <div id="blks"></div>
    <div class="bar"><button type="button" id="addN">+ 나레이션</button><button type="button" id="addD">+ 대사</button></div>
    <p class="hint" style="margin:6px 0 0">드래그 선택 후 B / I / A+ / A− (단축키 Ctrl·⌘+B/I) 적용 가능. 업로드 이미지는 가로 1000px 이하로 압축됩니다.</p>
  </section>

  <section class="pv-box">
    <div class="bar" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">3. 실시간 미리보기</h2>
      <div class="bar">
        <button type="button" id="cpTop" class="on">HTML 코드 바로 복사</button>
        <button type="button" id="dk">다크 배경 테스트</button>
      </div>
    </div>
    <div id="pv"></div>
    <div class="bar" style="margin-top:6px"><span class="hint">블록 우측 상단 스위치로 라이트/다크 전환 확인</span><span class="hint" id="msgTop" style="font-weight:700;color:var(--tx)"></span></div>
  </section>
</div>

<!-- 3. 접이식 티스토리 코드 & 스킨 연동 옵션 -->
<details class="det" id="codeDet">
  <summary>4. 티스토리 HTML 코드 보기 &amp; 스킨 다크모드 세부 설정 (클릭해서 펼치기)</summary>
  <textarea id="code" readonly spellcheck="false" style="height:120px"></textarea>
  <div class="bar" style="margin-top:6px"><button type="button" id="cp" class="on">코드 복사</button><span class="hint" id="msg"></span></div>
  <div class="grid" style="margin-top:10px">
    <label class="f">시작 모드<select id="mode"><option value="auto">스킨 따라가기 (스위치로 반전)</option><option value="light">항상 라이트로 시작</option><option value="dark">항상 다크로 시작</option></select></label>
    <label class="f">[스킨 따라가기] 다크모드 스킨 선택자 (쉼표 구분)<input type="text" id="dsel"></label>
  </div>
  <label class="hint" style="display:block;margin-top:6px"><input type="checkbox" id="pref" style="width:auto"> [스킨 따라가기] 기기 OS 다크모드 설정도 따르기</label>
</details>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const DEF={out:'#333333',fill:'#eeeeee',font:'#222222',style:'solid'};
const CK=['out','fill','font','nbg','nfg'];
const tNames={out:'나레이션 외곽선색',fill:'나레이션 채우기색',font:'나레이션 글자색',nbg:'이름표 배경색',nfg:'이름표 글자색'};
const lum=h=>(0.299*parseInt(h.slice(1,3),16)+0.587*parseInt(h.slice(3,5),16)+0.114*parseInt(h.slice(5,7),16))/255;
const normHex=s=>{s=s.trim();if(s[0]!=='#')s='#'+s;if(/^#[0-9a-f]{3}$/i.test(s))s='#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];return /^#[0-9a-f]{6}$/i.test(s)?s.toLowerCase():null};
const fix=c=>{c.nbg=normHex(c.nbg||'')||c.out;c.nfg=normHex(c.nfg||'')||(lum(c.out)>0.6?'#111111':'#ffffff');return c};

let chars={'캐릭터 A':{out:'#1d3557',fill:'#dbe7f5',font:'#1d3557',style:'solid'},'캐릭터 B':{out:'#6a1b9a',fill:'#f0e1f7',font:'#4a148c',style:'dashed'}};
let cfg={dark:'.dark, [data-theme="dark"], [data-mode="dark"], .dark-mode, .darkmode, .theme-dark',pref:false,mode:'auto',fn:14,fd:14,bw:1,rad:5,v:2};
try{const s=JSON.parse(localStorage.getItem('cb_v1')||'null');if(s){chars=s.chars||chars;cfg=Object.assign(cfg,s.cfg||{});if(!(s.cfg&&s.cfg.v>=2)){cfg.bw=1;cfg.rad=5;cfg.v=2}}}catch(e){}
Object.keys(chars).forEach(k=>fix(chars[k]));

let cur=Object.keys(chars)[0],target='out',hsv=[0,0,0],layout=2,imgData='';
let blocks=[{t:'n',c:cur,h:'나레이션 예시입니다.'},{t:'d',c:cur,h:'대사 예시입니다. <b>굵게</b>, <i>기울임</i> 사용 가능.'}];
const newUid=()=>'cb'+Math.random().toString(36).slice(2,8);let uid=newUid();
const save=()=>{try{localStorage.setItem('cb_v1',JSON.stringify({chars,cfg}))}catch(e){}};

/* HSV 컬러 피커 */
function hex2hsv(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let H=0;if(d){H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}return[H,mx?d/mx:0,mx]}
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return Math.round((v-v*s*Math.max(0,Math.min(k,4-k,1)))*255).toString(16).padStart(2,'0')};return '#'+f(5)+f(3)+f(1)}
function drawPk(){$('sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${hsv[0]},100%,50%))`;$('svc').style.left=hsv[1]*100+'%';$('svc').style.top=(1-hsv[2])*100+'%';$('huec').style.left=hsv[0]/360*100+'%'}
function setT(id){target=id;$('tgt').textContent='편집 중: '+tNames[id];CK.forEach(k=>$(k+'S').classList.toggle('sel',k===id));hsv=hex2hsv(chars[cur][id]);drawPk()}
function setColor(k,v){chars[cur][k]=v;$(k+'S').style.background=v;$(k+'H').value=v;if(k==='nbg'||k==='nfg')renderChips();save();update()}
function drag(el,fn){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);fn(e);const mv=ev=>fn(ev);el.addEventListener('pointermove',mv);el.addEventListener('pointerup',()=>el.removeEventListener('pointermove',mv),{once:true})})}
const cl=x=>Math.max(0,Math.min(1,x));
drag($('sv'),e=>{const r=$('sv').getBoundingClientRect();hsv[1]=cl((e.clientX-r.left)/r.width);hsv[2]=1-cl((e.clientY-r.top)/r.height);setColor(target,hsv2hex(...hsv));drawPk()});
drag($('hue'),e=>{const r=$('hue').getBoundingClientRect();hsv[0]=cl((e.clientX-r.left)/r.width)*359.99;setColor(target,hsv2hex(...hsv));drawPk()});
CK.forEach(k=>{
  $(k+'S').onclick=()=>setT(k);
  $(k+'H').onfocus=()=>setT(k);
  $(k+'H').oninput=e=>{const v=normHex(e.target.value);if(v){chars[cur][k]=v;$(k+'S').style.background=v;if(k==='nbg'||k==='nfg')renderChips();save();update();if(k===target){hsv=hex2hsv(v);drawPk()}}};
  $(k+'H').onblur=e=>{e.target.value=chars[cur][k]};
});

/* 캐릭터 칩 & 패널 */
function renderChips(){
  $('chips').innerHTML=Object.keys(chars).map(n=>{
    const c=chars[n];
    return `<button type="button" class="chip${n===cur?' sel':''}" data-n="${esc(n)}" style="background:${c.nbg};color:${c.nfg};border-color:${c.out}">${esc(n)}</button>`;
  }).join('');
}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.n;renderChips();fillPanel()};
function fillPanel(){const c=chars[cur];CK.forEach(k=>{$(k+'S').style.background=c[k];$(k+'H').value=c[k]});$('bs').value=c.style;hsv=hex2hsv(c[target]);drawPk()}
$('bs').onchange=e=>{chars[cur].style=e.target.value;save();update()};
const cmsg=t=>{$('cmsg').textContent=t};
const nm=()=>$('newName').value.trim();
function refresh(){save();renderChips();fillPanel();rows();update()}
$('add').onclick=()=>{const n=nm();if(!n)return cmsg('이름을 입력하세요.');if(chars[n])return cmsg('이미 있는 이름입니다.');chars[n]=fix(Object.assign({},DEF));cur=n;$('newName').value='';cmsg('추가했습니다.');refresh()};
$('ren').onclick=()=>{const n=nm();if(!n)return cmsg('바꿀 이름을 입력하세요.');if(n===cur)return;if(chars[n])return cmsg('이미 있는 이름입니다.');const o={};Object.keys(chars).forEach(k=>{o[k===cur?n:k]=chars[k]});chars=o;blocks.forEach(b=>{if(b.c===cur)b.c=n});cur=n;$('newName').value='';cmsg('이름을 바꿨습니다.');refresh()};
$('del').onclick=()=>{if(Object.keys(chars).length<2)return cmsg('최소 1명 필요합니다.');delete chars[cur];const f=Object.keys(chars)[0];blocks.forEach(b=>{if(b.c===cur)b.c=f});cur=f;cmsg('삭제했습니다.');refresh()};

/* 블록 편집 */
function rows(){
  const opts=sel=>Object.keys(chars).map(n=>`<option${n===sel?' selected':''}>${esc(n)}</option>`).join('');
  $('blks').innerHTML=blocks.map((b,i)=>`<div class="blk" data-i="${i}"><div class="bt"><select data-k="t"><option value="n"${b.t==='n'?' selected':''}>나레이션</option><option value="d"${b.t==='d'?' selected':''}>대사</option></select><select data-k="c">${opts(b.c)}</select><button type="button" data-a="up">↑</button><button type="button" data-a="dn">↓</button><button type="button" data-a="b"><b>B</b></button><button type="button" data-a="i"><i>I</i></button><button type="button" data-a="big">A+</button><button type="button" data-a="small">A−</button><input type="number" data-k="s" min="8" max="40" placeholder="크기" value="${b.s||''}"><button type="button" data-a="x">삭제</button></div><textarea data-k="h">${esc(b.h)}</textarea></div>`).join('');
}
$('blks').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(k!=='h'&&k!=='s')return;const b=blocks[+t.closest('.blk').dataset.i];if(k==='h')b.h=t.value;else b.s=parseFloat(t.value)||0;update()});
$('blks').addEventListener('keydown',e=>{const t=e.target;if(t.dataset.k==='h'&&(e.ctrlKey||e.metaKey)&&(e.key==='b'||e.key==='i')){e.preventDefault();wrap(t,e.key)}});
function wrap(ta,a){
  const m={b:['<b>','</b>'],i:['<i>','</i>'],big:['<span style="font-size:1.25em">','</span>'],small:['<span style="font-size:.8em">','</span>']}[a];
  const s=ta.selectionStart,en=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+m[0]+ta.value.slice(s,en)+m[1]+ta.value.slice(en);
  ta.focus();ta.setSelectionRange(s+m[0].length,en+m[0].length);
  blocks[+ta.closest('.blk').dataset.i].h=ta.value;update();
}
$('blks').addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'){blocks[+t.closest('.blk').dataset.i][t.dataset.k]=t.value;update()}});
$('blks').addEventListener('click',e=>{
  const bt=e.target.closest('button');if(!bt)return;
  const blk=bt.closest('.blk'),i=+blk.dataset.i,a=bt.dataset.a;
  if(['b','i','big','small'].includes(a))return wrap(blk.querySelector('textarea'),a);
  if(a==='up'&&i>0)[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];
  if(a==='dn'&&i<blocks.length-1)[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];
  if(a==='x')blocks.splice(i,1);
  rows();update();
});
$('addN').onclick=()=>{blocks.push({t:'n',c:cur,h:''});rows();update()};
$('addD').onclick=()=>{blocks.push({t:'d',c:cur,h:''});rows();update()};
const setL=n=>{layout=n;$('l1').classList.toggle('on',n===1);$('l2').classList.toggle('on',n===2);update()};
$('l1').onclick=()=>setL(1);$('l2').onclick=()=>setL(2);

/* 이미지 처리 */
$('imgurl').oninput=update;
function loadImg(f){
  if(!f||!f.type||!f.type.startsWith('image/'))return;
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const sc=Math.min(1,1000/im.naturalWidth),w=Math.round(im.naturalWidth*sc),h=Math.round(im.naturalHeight*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    imgData=c.toDataURL('image/jpeg',0.85);URL.revokeObjectURL(u);
    $('imsg').textContent=w+'×'+h+'px (~'+Math.round(imgData.length*0.75/1024)+'KB)';update();
  };
  im.onerror=()=>{URL.revokeObjectURL(u);$('imsg').textContent='이미지 로드 실패'};
  im.src=u;
}
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>{loadImg(e.target.files[0]);e.target.value=''};
$('imgclr').onclick=()=>{imgData='';$('imgurl').value='';$('imsg').textContent='';update()};
document.addEventListener('paste',e=>{const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();loadImg(it.getAsFile())}});
document.addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('over')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('drop').classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();$('drop').classList.remove('over');loadImg(e.dataTransfer.files[0])});

/* 출력 코드 생성 (기존 티스토리 출력 스타일 그대로 유지) */
function nameScale(n){
  let w=0;
  for(const ch of n)w+=/\s/.test(ch)?.3:/[A-Z0-9]/.test(ch)?.7:/[a-z]/.test(ch)?.6:ch.charCodeAt(0)<128?.45:1;
  w*=1.05;return w<=3.9?1:Math.max(.5,3.9/w);
}
function gen(){
  const {bw,fn,fd,rad,mode}=cfg,LT='--cb-bg:#FCFCFC',DK='--cb-bg:#3B3B3B';
  let css=`.cb{position:relative;margin:24px 0 16px}.cb-ck{position:absolute;opacity:0;width:0;height:0;margin:0;padding:0;border:0;pointer-events:none}.cb-in,.cb-in *{box-sizing:border-box;font-family:inherit}.cb-in{${LT};border:${bw}px solid #A50000;border-radius:${rad}px;background:var(--cb-bg);padding:10px;display:grid;gap:10px;align-items:stretch;font-size:14px;line-height:1.55;text-align:left}.cb-ck:checked+.cb-in{${DK}}.cb-in b,.cb-in strong{font-weight:700!important}.cb-in i,.cb-in em{font-style:italic!important}.cb-sw{position:absolute;top:-20px;right:2px;display:block;margin:0;padding:3px;cursor:pointer;line-height:0}.cb-tr{position:relative;display:block;width:24px;height:14px;border-radius:7px;background:#9a9a9a;transition:background .2s}.cb-tr:after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#3B3B3B;transition:left .2s}.cb-ck:checked~.cb-sw .cb-tr{background:#A50000}.cb-ck:checked~.cb-sw .cb-tr:after{left:12px}.cb-ck:focus-visible~.cb-sw .cb-tr{outline:2px solid #1f5fbf;outline-offset:2px}.cb-img{position:relative;align-self:start;aspect-ratio:5/7;overflow:hidden;background:rgba(128,128,128,.12)}.cb-img img{position:absolute!important;top:0;left:0;width:100%!important;height:100%!important;max-width:none!important;margin:0!important;object-fit:contain}.cb-ph{position:absolute;inset:0;border:1px dashed #888;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:8px}.cb-one .cb-img{width:100%;max-width:480px;margin:0 auto}.cb-two{grid-template-columns:1fr 1fr}.cb-two .cb-tx{position:relative;min-height:0}.cb-two .cb-sc{position:absolute;inset:0;overflow:auto}.cb-n{padding:8px 10px;margin:0 0 8px;font-size:${fn}px}.cb-d{display:flex;align-items:flex-start;margin:0 0 8px;font-size:${fd}px}.cb-nm{position:relative;z-index:1;flex:0 0 4.6em;width:4.6em;height:2.2em;margin-right:-${bw}px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.85em;line-height:1.25;padding:0 .2em;border:${bw}px solid #000;overflow:hidden;white-space:nowrap}.cb-ns{display:block;white-space:nowrap}.cb-bt{flex:1;min-width:0;background:#fff;color:#111;border:${bw}px solid #000;padding:8px 12px}.cb-sc{scrollbar-width:none;-ms-overflow-style:none}.cb-sc::-webkit-scrollbar{display:none;width:0;height:0}@media(max-width:640px){.cb-two{grid-template-columns:1fr}.cb-two .cb-tx,.cb-two .cb-sc{position:static;overflow:visible}}`;
  if(mode==='auto'){
    const sk=cfg.dark.split(',').map(x=>x.trim()).filter(Boolean);
    if(sk.length)css+=sk.map(x=>x+' .cb-ck+.cb-in').join(',')+`{${DK}}`+sk.map(x=>x+' .cb-ck:checked+.cb-in').join(',')+`{${LT}}`;
    if(cfg.pref)css+=`@media(prefers-color-scheme:dark){.cb-ck+.cb-in{${DK}}.cb-ck:checked+.cb-in{${LT}}}`;
  }
  const src=$('imgurl').value.trim()||imgData;
  const img=src?`<img src="${esc(src)}" alt="">`:'<div class="cb-ph">이미지를 업로드하거나<br>붙여넣어 주세요</div>';
  const inner=blocks.map(b=>{
    const ch=chars[b.c]||DEF,h=b.h.replace(/\r?\n/g,'<br>'),sz=b.s>0?`font-size:${b.s}px;`:'';
    if(b.t==='n')return `<div class="cb-n" style="${sz}border:${bw}px ${ch.style} ${ch.out};background:${ch.fill};color:${ch.font}">${h}</div>`;
    const nb=ch.nbg||ch.out,nf=ch.nfg||(lum(nb)>0.6?'#111':'#fff'),sc=nameScale(b.c);
    return `<div class="cb-d"${sz?` style="${sz}"`:''}><div class="cb-nm" style="background:${nb};color:${nf}"><span class="cb-ns"${sc<1?` style="font-size:${Math.round(sc*100)}%"`:''}>${esc(b.c)}</span></div><div class="cb-bt" style="border-style:${ch.style}">${h}</div></div>`;
  }).join('');
  return `<style>${css}</style><div class="cb"><input type="checkbox" class="cb-ck" id="${uid}"${mode==='dark'?' checked':''} aria-label="라이트/다크 전환"><div class="cb-in ${layout===2?'cb-two':'cb-one'}"><div class="cb-img">${img}</div><div class="cb-tx"><div class="cb-sc">${inner}</div></div></div><label class="cb-sw" for="${uid}"><span class="cb-tr"></span></label></div>`;
}

/* 렌더링, 복사 & JSON 파일 다운로드/업로드 */
function update(){const h=gen();$('pv').innerHTML=h;if($('codeDet').open)$('code').value=h}
$('codeDet').ontoggle=()=>{if($('codeDet').open)$('code').value=gen()};
$('dk').onclick=()=>{const p=$('pv'),on=p.classList.toggle('dk');p.classList.toggle('dark',on);on?p.setAttribute('data-theme','dark'):p.removeAttribute('data-theme');$('dk').textContent=on?'라이트 배경 테스트':'다크 배경 테스트'};
$('dsel').value=cfg.dark;$('pref').checked=cfg.pref;$('mode').value=cfg.mode;
$('mode').onchange=e=>{cfg.mode=e.target.value;save();update()};
[['fn',8,40],['fd',8,40],['bw',0.3,4],['rad',0,30]].forEach(([k,lo,hi])=>{$(k).value=cfg[k];$(k).oninput=e=>{const v=parseFloat(e.target.value);if(v>=lo&&v<=hi){cfg[k]=v;save();update()}}});
$('dsel').oninput=e=>{cfg.dark=e.target.value;save();update()};
$('pref').onchange=e=>{cfg.pref=e.target.checked;save();update()};

async function copyCode(msgEl){
  const t=gen();
  try{await navigator.clipboard.writeText(t)}catch(e){$('codeDet').open=true;$('code').value=t;$('code').select();document.execCommand('copy')}
  msgEl.textContent='복사되었습니다!';setTimeout(()=>msgEl.textContent='',2000);
  uid=newUid();update();
}
$('cp').onclick=()=>copyCode($('msg'));
$('cpTop').onclick=()=>copyCode($('msgTop'));

$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({chars,cfg},null,2)],{type:'application/json'});
  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=`comics-preset-${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(u);
  $('msg2').textContent='파일로 저장했습니다.';setTimeout(()=>$('msg2').textContent='',2500);
};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      Object.keys(d.chars||{}).forEach(k=>{chars[k]=fix(Object.assign({},DEF,d.chars[k]))});
      if(d.cfg)cfg=Object.assign(cfg,d.cfg);
      if(!chars[cur])cur=Object.keys(chars)[0];
      $('dsel').value=cfg.dark;$('pref').checked=cfg.pref;$('mode').value=cfg.mode;
      ['fn','fd','bw','rad'].forEach(k=>$(k).value=cfg[k]);
      save();renderChips();fillPanel();rows();update();
      $('msg2').textContent='설정을 불러왔습니다.';
    }catch(err){$('msg2').textContent='올바른 JSON 파일이 아닙니다.'}
    setTimeout(()=>$('msg2').textContent='',2500);
  };
  r.readAsText(f);e.target.value='';
};

renderChips();fillPanel();rows();setT('out');update();
</script>
